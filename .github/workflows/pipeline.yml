
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =====================================================
  # JOB 1: DATA REGISTRATION
  # =====================================================
  # This job checks out code, sets up Python, registers the dataset, and uploads it as an artifact
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # =====================================================
  # JOB 2: DATA PREPARATION
  # =====================================================
  # This job loads the dataset from the previous step, processes features, and saves split files
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 scikit-learn==1.6.1

      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # =====================================================
  # JOB 3: MODEL TRAINING AND REGISTRATION
  # =====================================================
  # This job trains the model, tracks experiments via MLflow, and commits the finalized model
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3
          pip install numpy==2.2.6
          pip install scikit-learn==1.6.1
          pip install joblib==1.5.1
          pip install mlflow==3.0.1

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Verify Downloaded Splits
        run: |
          ls -lh Xtrain.csv Xtest.csv ytrain.csv ytest.csv

      - name: Model Building and Experiment Tracking
        run: |
          python tourism_project/model_building/train.py

      - name: Upload MLflow Experiment Results
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-experiment-results
          path: mlruns/
          if-no-files-found: warn

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.joblib
          git add tourism_project/deployment/model_comparison.csv
          git add tourism_project/deployment/model_metadata.json

          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"

          git push
